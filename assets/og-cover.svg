<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B2A2A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5A4"/>
      <stop offset="100%" stop-color="#22D3D3"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5A4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0EA5A4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Фон -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Декоративное свечение справа -->
  <circle cx="980" cy="315" r="320" fill="url(#glow)"/>

  <!-- Декор: сетка нейросети (лёгкая) -->
  <g stroke="#0EA5A4" stroke-width="1" fill="none" opacity="0.18">
    <line x1="800" y1="120" x2="900" y2="220"/>
    <line x1="800" y1="120" x2="900" y2="180"/>
    <line x1="900" y1="180" x2="900" y2="220"/>
    <line x1="900" y1="220" x2="980" y2="315"/>
    <line x1="900" y1="180" x2="980" y2="315"/>
    <line x1="900" y1="220" x2="820" y2="430"/>
    <line x1="980" y1="315" x2="1100" y2="430"/>
  </g>
  <g fill="#0EA5A4" opacity="0.55">
    <circle cx="800" cy="120" r="6"/>
    <circle cx="900" cy="180" r="7"/>
    <circle cx="900" cy="220" r="6"/>
    <circle cx="820" cy="430" r="6"/>
    <circle cx="1100" cy="430" r="6"/>
  </g>
  <circle cx="980" cy="315" r="14" fill="#0EA5A4"/>
  <circle cx="980" cy="315" r="26" fill="none" stroke="#0EA5A4" stroke-width="2" opacity="0.4"/>
  <circle cx="980" cy="315" r="42" fill="none" stroke="#0EA5A4" stroke-width="1.5" opacity="0.2"/>

  <!-- Логотип-метка слева сверху -->
  <g transform="translate(80, 80)">
    <rect width="56" height="56" rx="12" fill="url(#accent)"/>
    <circle cx="28" cy="28" r="14" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="28" y1="28" x2="28" y2="18" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="28" y1="28" x2="36" y2="32" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="76" y="38" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">Time Saver AI</text>
  </g>

  <!-- Главный заголовок -->
  <text x="80" y="290" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="800" fill="#FFFFFF">
    ИИ-агенты, которые
  </text>
  <text x="80" y="380" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="800" fill="url(#accent)">
    дарят вам время
  </text>

  <!-- Подзаголовок -->
  <text x="80" y="450" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400" fill="#CBD5E1">
    Автоматизация задач на базе Claude Code
  </text>
  <text x="80" y="488" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400" fill="#CBD5E1">
    Сбор данных · Отчёты · Тексты
  </text>

  <!-- Плашка CTA -->
  <g transform="translate(80, 540)">
    <rect width="280" height="56" rx="28" fill="url(#accent)"/>
    <text x="140" y="36" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">
      Написать в Telegram →
    </text>
  </g>

  <!-- Подпись внизу справа -->
  <text x="1120" y="590" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#94A3B8">
    Нина · AI-специалист по автоматизации
  </text>
</svg>
